<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>⚙️ Paramètres</h2>
    <button class="btn btn-outline-secondary" type="button" (click)="resetToDefault()">↺ Réinitialiser</button>
  </div>

  <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <form [formGroup]="settingsForm">
    
    <div class="card mb-4">
      <div class="card-header">
        <h5 class="mb-0">🏢 Profil de l'organisation</h5>
      </div>
      <div class="card-body">
        <div formGroupName="organisation">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Nom de l'organisation</label>
              <input type="text" class="form-control" formControlName="nom">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Email de contact</label>
              <input type="email" class="form-control" formControlName="email">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Téléphone</label>
              <input type="tel" class="form-control" formControlName="telephone">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Pays</label>
              <select class="form-select" formControlName="pays">
                <option *ngFor="let p of paysList" [value]="p">{{ p }}</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>

   
    <div class="card mb-4">
      <div class="card-header">
        <h5 class="mb-0">🤖 Paramètres d'extraction IA</h5>
      </div>
      <div class="card-body">
        <div formGroupName="extraction">
          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label">Seuil de validation automatique (%)</label>
              <input type="number" class="form-control" formControlName="seuilAuto">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Langue par défaut</label>
              <select class="form-select" formControlName="langue">
                <option *ngFor="let l of languesList" [value]="l">{{ l }}</option>
              </select>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Score minimum pour valider sans intervention (%)</label>
              <input type="number" class="form-control" formControlName="scoreMin">
            </div>
          </div>
        </div>
      </div>
    </div>

    
    <div class="card mb-4">
      <div class="card-header">
        <h5 class="mb-0">🔔 Notifications & apprentissage</h5>
      </div>
      <div class="card-body">
        <div formGroupName="notifications">
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" formControlName="email">
            <label class="form-check-label">Notifications email</label>
          </div>
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" formControlName="alerteErreur">
            <label class="form-check-label">Alerte sur les documents en erreur</label>
          </div>
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" formControlName="apprentissageContinu">
            <label class="form-check-label">Mode apprentissage continu</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" formControlName="ameliorerModele">
            <label class="form-check-label">Améliorer le modèle avec les corrections</label>
          </div>
        </div>
      </div>
    </div>

    
    <div class="card mb-4">
      <div class="card-header">
        <h5 class="mb-0">🔐 Sécurité & Authentification</h5>
      </div>
      <div class="card-body">
        <div formGroupName="securite">
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" formControlName="deuxFacteurs">
            <label class="form-check-label">Authentification à deux facteurs (2FA)</label>
          </div>
          <div class="row" *ngIf="settingsForm.get('securite.deuxFacteurs')?.value">
            <div class="col-md-6 mb-3">
              <label class="form-label">Type 2FA</label>
              <select class="form-select" formControlName="deuxFacteursType">
                <option value="TOTP">TOTP (Google Authenticator)</option>
                <option value="SMS">SMS</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6">
              <label class="form-label">Durée de session (heures)</label>
              <input type="number" class="form-control" formControlName="dureeSession">
            </div>
          </div>
        </div>
      </div>
    </div>

    
    <div class="d-flex gap-2 mt-3">
      <button type="button" class="btn btn-primary" (click)="saveSettings()">💾 Enregistrer les modifications</button>
      <button type="button" class="btn btn-secondary" (click)="resetToDefault()">↺ Annuler / Réinitialiser</button>
    </div>
  </form>
</div>
