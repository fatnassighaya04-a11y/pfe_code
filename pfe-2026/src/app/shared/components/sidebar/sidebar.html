<aside class="sidebar" [class.collapsed]="collapsed">

  <!-- LOGO -->
  <div class="sidebar-brand">
    <div class="brand-icon">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <rect width="22" height="22" rx="6" fill="#6C63FF"/>
        <path d="M5 11h12M11 5v12" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <circle cx="11" cy="11" r="3" stroke="white" stroke-width="1.8"/>
      </svg>
    </div>
    <span class="brand-name" *ngIf="!collapsed">ExtractAI</span>
    <button class="collapse-btn" (click)="collapsed = !collapsed" [title]="collapsed ? 'Agrandir' : 'Réduire'">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path [attr.d]="collapsed ? 'M4 7h6M7 4l3 3-3 3' : 'M10 7H4M7 4L4 7l3 3'"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- NAVIGATION -->
  <nav class="sidebar-nav">
    <div class="nav-section-label" *ngIf="!collapsed">Menu principal</div>

    <ng-container *ngFor="let item of navItems">
      <div class="nav-item-wrapper"
           *ngIf="canSee(item)"
           (mouseenter)="showTooltip(item.label)"
           (mouseleave)="hideTooltip()">

        <button class="nav-item" [class.active]="isActive(item.route)" [routerLink]="item.route">

          <!-- ICONE (personnalisez selon votre bibliothèque) -->
          <span class="nav-icon">
            <ng-container [ngSwitch]="item.icon">
              <svg *ngSwitchCase="'dashboard'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
              </svg>
              <svg *ngSwitchCase="'upload'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 3v12m0 0-3-3m3 3 3-3M5 21h14"/>
              </svg>
              <svg *ngSwitchCase="'documents'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
              </svg>
              <svg *ngSwitchCase="'validation'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
              <svg *ngSwitchCase="'users'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
              <svg *ngSwitchCase="'analytics'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
              </svg>
              <svg *ngSwitchCase="'api'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4v16h16"/><path d="m8 9 3 3-3 3"/><path d="m16 9-3 3 3 3"/>
              </svg>
              <svg *ngSwitchCase="'history'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
              </svg>
              <svg *ngSwitchCase="'settings'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
              <svg *ngSwitchDefault width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
              </svg>
            </ng-container>
          </span>

          <span class="nav-label" *ngIf="!collapsed">
            {{ item.label }}
          </span>

        </button>

        <!-- Tooltip -->
        <div class="nav-tooltip" *ngIf="collapsed && tooltipItem === item.label">
          {{ item.tooltip || item.label }}
        </div>

      </div>
    </ng-container>
  </nav>

  <!-- USER FOOTER -->
  <div class="sidebar-footer">
    <div class="user-card">
      <div class="user-avatar" [title]="user?.email">
        {{ getInitials() }}
      </div>
      <div class="user-info" *ngIf="!collapsed">
        <div class="user-name">{{ user?.username || user?.name || user?.email }}</div>
        <div class="user-role">{{ user?.role }}</div>
      </div>
      <button class="logout-btn" (click)="logout()" title="Déconnexion" *ngIf="!collapsed">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M5 2H3a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h2M9 4l3 3-3 3M12 7H5"
                stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</aside>
