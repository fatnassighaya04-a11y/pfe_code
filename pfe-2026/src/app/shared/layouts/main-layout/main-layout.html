<div class="layout-container">
  <aside class="sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-header">
      <div class="logo">
        <img src="assets/logo.svg" alt="Logo" class="logo-img">
        <span class="logo-text" *ngIf="!sidebarCollapsed">ExtractAI</span>
      </div>
      <button class="toggle-btn" (click)="toggleSidebar()">
        <i class="bi bi-chevron-left" *ngIf="!sidebarCollapsed"></i>
        <i class="bi bi-chevron-right" *ngIf="sidebarCollapsed"></i>
      </button>
    </div>

    <div class="sidebar-menu">
      
      <div class="menu-section">
        <span class="menu-label" *ngIf="!sidebarCollapsed">MENU PRINCIPAL</span>

        <a routerLink="/dashboard" routerLinkActive="active" class="menu-item">
          <i class="bi bi-speedometer2"></i>
          <span class="menu-text" *ngIf="!sidebarCollapsed">Tableau de bord</span>
        </a>

       
        <a *ngIf="hasRole(['ADMIN','GESTIONNAIRE','OPERATEUR'])"
           routerLink="/upload" routerLinkActive="active" class="menu-item">
          <i class="bi bi-cloud-upload"></i>
          <span class="menu-text" *ngIf="!sidebarCollapsed">Upload & Extraction</span>
        </a>

        
        <a routerLink="/documents" routerLinkActive="active" class="menu-item">
          <i class="bi bi-files"></i>
          <span class="menu-text" *ngIf="!sidebarCollapsed">Documents</span>
        </a>

        
        <a *ngIf="hasRole(['ADMIN','GESTIONNAIRE','OPERATEUR'])"
           routerLink="/validation" routerLinkActive="active" class="menu-item">
          <i class="bi bi-check-circle"></i>
          <span class="menu-text" *ngIf="!sidebarCollapsed">Validation</span>
        </a>
      </div>

      
      <div class="menu-section" *ngIf="hasRole(['ADMIN'])">
        <span class="menu-label" *ngIf="!sidebarCollapsed">ADMIN</span>

        <a routerLink="/users" routerLinkActive="active" class="menu-item">
          <i class="bi bi-people"></i>
          <span class="menu-text" *ngIf="!sidebarCollapsed">Utilisateurs</span>
        </a>

        <a routerLink="/api-integrations" routerLinkActive="active" class="menu-item">
          <i class="bi bi-plugin"></i>
          <span class="menu-text" *ngIf="!sidebarCollapsed">API & Intégrations</span>
        </a>

        
        <a routerLink="/log-activity" routerLinkActive="active" class="menu-item">
          <i class="bi bi-clock-history"></i>
          <span class="menu-text" *ngIf="!sidebarCollapsed">Journal d'activité</span>
        </a>
      </div>

      
      <div class="menu-section" *ngIf="hasRole(['ADMIN','GESTIONNAIRE'])">
        <span class="menu-label" *ngIf="!sidebarCollapsed">GESTION</span>

        <a routerLink="/analytics" routerLinkActive="active" class="menu-item">
          <i class="bi bi-graph-up"></i>
          <span class="menu-text" *ngIf="!sidebarCollapsed">Analytics</span>
        </a>

        <a routerLink="/settings" routerLinkActive="active" class="menu-item">
          <i class="bi bi-gear"></i>
          <span class="menu-text" *ngIf="!sidebarCollapsed">Paramètres</span>
        </a>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">
          <span>{{ userInitials }}</span>
        </div>
        <div class="user-details" *ngIf="!sidebarCollapsed">
          <span class="user-name">{{ userName }}</span>
          <span class="user-role">{{ userRole }}</span>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()" *ngIf="!sidebarCollapsed">
        <i class="bi bi-box-arrow-right"></i>
        <span>Déconnexion</span>
      </button>
    </div>
  </aside>

  <main class="main-content" [class.expanded]="sidebarCollapsed">
    <router-outlet></router-outlet>
  </main>
</div>
