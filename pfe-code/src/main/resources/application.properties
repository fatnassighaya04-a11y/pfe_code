

# --- Nom de l'application ---
spring.application.name=doc-extraction

# ================================================================
# BASE DE DONNÉES POSTGRESQL
# ================================================================

# URL de connexion : jdbc:postgresql://HOST:PORT/NOM_BASE
# ${DB_URL} = variable d'environnement (si définie), sinon la valeur par défaut après ':'
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/doc_extraction_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:ghayouta}

# Driver JDBC PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de connexions HikariCP (inclus dans Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ================================================================
# JPA / HIBERNATE
# ================================================================

# TRÈS IMPORTANT : 'validate' = Hibernate vérifie que le schéma BDD
# correspond aux entités, mais ne modifie RIEN.
# NE JAMAIS mettre 'create' ou 'create-drop' en production !
# Options : validate | update | create | create-drop | none
spring.jpa.hibernate.ddl-auto=update

# Afficher les requêtes SQL dans la console (utile pour déboguer)
spring.jpa.show-sql=true

# Formater le SQL pour le rendre lisible
spring.jpa.properties.hibernate.format_sql=true

# Dialecte : dit à Hibernate qu'on utilise PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Support des types PostgreSQL avancés (JSONB, UUID, etc.)
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Nommage des colonnes : convertit camelCase → snake_case
# Ex : createdAt → created_at, firstName → first_name
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ================================================================
# FLYWAY — MIGRATIONS SQL
# ================================================================

# Activer Flyway
spring.flyway.enabled=true

# Même URL/credentials que la datasource
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/doc_extraction_db}
spring.flyway.user=${DB_USERNAME:postgres}
spring.flyway.password=${DB_PASSWORD:majdi}

# Dossier où Flyway cherche les scripts SQL de migration
spring.flyway.locations=classpath:db/migration

# Créer la table flyway_schema_history si elle n'existe pas
spring.flyway.baseline-on-migrate=true

# ================================================================
# JWT — JSON WEB TOKEN
# ================================================================

# Clé secrète pour signer les tokens (MINIMUM 256 bits = 32 caractères)
# EN PRODUCTION : utiliser une vraie clé aléatoire via variable d'environnement !
jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyForJWTPFEProjectDocExtraction2024!}

# Durée de validité du Access Token : 15 minutes (en millisecondes) j'ai changer en 24h pour le test
# 15 * 60 * 1000 = 900000 ms
jwt.access-token-expiration=86400000
app.auto-validation.threshold=85
# Durée de validité du Refresh Token : 7 jours (en millisecondes)
# 7 * 24 * 60 * 60 * 1000 = 604800000 ms
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ================================================================
# UPLOAD DE FICHIERS
# ================================================================

# Taille maximum d'un fichier uploadé (20 MB)
spring.servlet.multipart.max-file-size=20MB

# Taille maximum de la requête entière (aussi 20 MB)
spring.servlet.multipart.max-request-size=20MB

# Répertoire de stockage des fichiers uploadés
# IMPORTANT : ce dossier doit exister sur le serveur !
file.storage.location=${FILE_STORAGE_PATH:./uploads}

# Types MIME acceptés (séparés par des virgules)
file.allowed-types=application/pdf,image/png,image/jpeg,image/tiff,image/bmp,\
  application/vnd.openxmlformats-officedocument.wordprocessingml.document,\
  application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,\
  text/plain

# ================================================================
# OPENROUTER / GEMINI
# ================================================================
# Clé API OpenRouter (NE JAMAIS committer cette valeur dans Git !)
openrouter.api-key=${OPENROUTER_API_KEY:your_openrouter_api_key}

# URL de base OpenRouter
openrouter.base-url=https://openrouter.ai/api/v1

# Modèle Gemini via OpenRouter
openrouter.model=google/gemini-2.0-flash-001

# Timeout des requêtes vers OpenRouter (60 secondes)
openrouter.timeout-seconds=60

# Nom et site envoyés dans les headers OpenRouter
openrouter.app-name=doc-extraction
openrouter.site-url=http://localhost:8080

# ================================================================
# SERVEUR
# ================================================================

# Port d'écoute (8080 par défaut)
server.port=8080

# Préfixe de toutes les URLs de l'API
server.servlet.context-path=/

# ================================================================
# SWAGGER / OPENAPI
# ================================================================

# URL de la documentation : http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ================================================================
# LOGS
# ================================================================

# Niveau de log global
logging.level.root=INFO

# Logs détaillés pour notre package (utile en développement)
logging.level.com.pfe.docextraction=DEBUG

# Logs SQL Hibernate (montre les paramètres des requêtes préparées)
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Format des logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.org.springframework.security=DEBUG

# Actuator
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# ================================================================
# OCR — Tesseract pour PDF scannés
# ================================================================
ocr.tessdata-path=${OCR_TESSDATA_PATH:./tessdata}
ocr.language=${OCR_LANGUAGE:fra+eng}
ocr.dpi=${OCR_DPI:300}
