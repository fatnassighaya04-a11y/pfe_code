


spring.application.name=doc-extraction



spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/doc_extraction_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:ghayouta}


spring.datasource.driver-class-name=org.postgresql.Driver


spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update


spring.jpa.show-sql=true


spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true


spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


spring.flyway.enabled=false


spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/doc_extraction_db}
spring.flyway.user=${DB_USERNAME:postgres}
spring.flyway.password=${DB_PASSWORD:ghayouta}


spring.flyway.locations=classpath:db/migration

spring.flyway.baseline-on-migrate=true


jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyForJWTPFEProjectDocExtraction2024!}

jwt.access-token-expiration=86400000
app.jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyForJWTPFEProjectDocExtraction2024!}
app.jwt.expiration=86400000
app.auto-validation.threshold=85

jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}


spring.servlet.multipart.max-file-size=20MB


spring.servlet.multipart.max-request-size=20MB


file.storage.location=${FILE_STORAGE_PATH:./uploads}

file.allowed-types=application/pdf,image/png,image/jpeg,image/tiff,image/bmp,\
  application/vnd.openxmlformats-officedocument.wordprocessingml.document,\
  application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,\
  text/plain



openrouter.base-url=https://openrouter.ai/api/v1


openrouter.model=google/gemini-2.0-flash-001

openrouter.timeout-seconds=60

openrouter.app-name=doc-extraction
openrouter.site-url=http://localhost:8080


server.port=8080


server.servlet.context-path=/

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs


logging.level.root=INFO


logging.level.com.pfe.docextraction=DEBUG

logging.level.org.hibernate.type.descriptor.sql=TRACE


logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.org.springframework.security=DEBUG


management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always


ocr.tessdata-path=${OCR_TESSDATA_PATH:./tessdata}
ocr.language=${OCR_LANGUAGE:fra+eng}
